# Features
features:
  masking: true                   # hold back, rewrite or withhold internal names for non-admin roles
  masked_role_instruction: true   # also tell the model not to narrate internals (prevention).
                                  # Turn off to see how the holdback performs on its own.

initial_state:
  read_page_size: 20              # 20 entries per page

# Model providers offered at startup. A provider appears in the menu only when its key
# is set in .env. The models of the chosen provider are fetched live.
providers:
  - label: DeepSeek
    litellm_provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    api_base: https://api.deepseek.com    # DeepSeek is asked for its model list at this address
    default_model: deepseek-v4-flash
  - label: OpenAI
    litellm_provider: openai
    api_key_env: OPENAI_API_KEY
    admin_key_env: OPENAI_ADMIN_KEY       # optional: lets the menu show this month's spend
    default_model: gpt-4.1-mini

# Where runtime state lives. Paths are relative to the project root unless absolute.
# The whole data/ folder is gitignored. OPS_DESK_DB overrides database.path.
database:
  path: data/ops.db                # the operations database (schema managed by Alembic)
  sessions_path: data/session.db   # ADK's own session store

# Terminal Look - fonts styles and colors for different message kinds in terminal UI for ops desk chatbot
styles:
  thinking: "grey62 italic"
  user: "#7ed957"
  agent: "#f97316"
  tool_call: "#c98b8b"
  tool_response: "#8b9cc9"

labels:
  user: "[user]:"
  thinking_prefix: "thinking"
  tool_call_glyph: "⚙"
  tool_response_glyph: "↪"

display:
  user:
    show_thinking: false
    show_tool_call: false
    show_tool_response: false
    show_agent_name: false
    show_error_details: false
    show_subagent_answers: false
    code_theme: "monokai"
    width: 0                      # use default terminal width
    # masking:
    #   kinds: [agent, tool]
    #   rewrite_answers: true
  admin:
    show_thinking: true
    show_tool_call: true
    show_tool_response: true
    show_agent_name: true
    show_error_details: true
    show_subagent_answers: true
    tool_response_max_chars: 300
    code_theme: "monokai"
    width: 0                      # use default terminal width
    # masking:
    #   kinds: []
    #   rewrite_answers: false